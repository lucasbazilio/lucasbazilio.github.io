<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photographs - Luxembourg (2025)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f9f9f9;
            color: #222;
        }

        header {
            background-color: #2e2b5f;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            padding: 2rem;
        }

        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease-in-out;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        .back-link {
            display: block;
            margin: 1rem 2rem;
            color: #2e2b5f;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>Luxembourg (2025)</h1>
    </header>

    <a class="back-link" href="../index.html">&larr; Back to main site</a>

    <div class="gallery">
        <img src="sample1.jpg" alt="Photo 1">
        <img src="sample2.jpg" alt="Photo 2">
        <img src="sample3.jpg" alt="Photo 3">
        <img src="sample4.jpg" alt="Photo 4">
        <img src="sample5.jpg" alt="Photo 5">
        <img src="sample6.jpg" alt="Photo 6">
        <img src="sample7.jpg" alt="Photo 7">
        <img src="sample8.jpg" alt="Photo 8">
        <img src="sample9.jpg" alt="Photo 9">
    </div>
</body>
</html>
