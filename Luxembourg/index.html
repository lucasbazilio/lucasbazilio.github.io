<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photographs - Luxembourg (2025)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f9f9f9;
            color: #222;
        }

        header {
            background-color: #2e2b5f;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            padding: 2rem;
        }

        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        .back-link {
            display: block;
            margin: 1rem 2rem;
            color: #2e2b5f;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Lightbox Styles */
        .lightbox {
            position: fixed;
            display: none;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }

        .lightbox:target {
            display: flex;
        }

        .lightbox-close {
            position: fixed;
            top: 2rem;
            right: 2rem;
            color: white;
            font-size: 2rem;
            text-decoration: none;
            font-weight: bold;
            z-index: 1001;
        }

        .lightbox-close:hover {
            color: #d1b02f;
        }
    </style>
</head>
<body>
    <header>
        <h1>Luxembourg (2025)</h1>
    </header>

    <a class="back-link" href="../index.html">&larr; Back to main site</a>

    <div class="gallery">
        <!-- Link each image to the lightbox -->
        <a href="#img1"><img src="sample1.jpg" alt="Photo 1"></a>
        <a href="#img2"><img src="sample2.jpg" alt="Photo 2"></a>
        <a href="#img3"><img src="sample3.jpg" alt="Photo 3"></a>
        <a href="#img4"><img src="sample4.jpg" alt="Photo 4"></a>
        <a href="#img5"><img src="sample5.jpg" alt="Photo 5"></a>
        <a href="#img6"><img src="sample6.jpg" alt="Photo 6"></a>
        <a href="#img7"><img src="sample7.jpg" alt="Photo 7"></a>
        <a href="#img8"><img src="sample8.jpg" alt="Photo 8"></a>
        <a href="#img9"><img src="sample9.jpg" alt="Photo 9"></a>
    </div>

    <!-- Lightbox overlays -->
    <div id="img1" class="lightbox"><a href="#" class="lightbox-close">&times;</a><img src="sample1.jpg" alt="Photo 1"></div>
    <div id="img2" class="lightbox"><a href="#" class="lightbox-close">&times;</a><img src="sample2.jpg" alt="Photo 2"></div>
    <div id="img3" class="lightbox"><a href="#" class="lightbox-close">&times;</a><img src="sample3.jpg" alt="Photo 3"></div>
    <div id="img4" class="lightbox"><a href="#" class="lightbox-close">&times;</a><img src="sample4.jpg" alt="Photo 4"></div>
    <div id="img5" class="lightbox"><a href="#" class="lightbox-close">&times;</a><img src="sample5.jpg" alt="Photo 5"></div>
    <div id="img6" class="lightbox"><a href="#" class="lightbox-close">&times;</a><img src="sample6.jpg" alt="Photo 6"></div>
    <div id="img7" class="lightbox"><a href="#" class="lightbox-close">&times;</a><img src="sample7.jpg" alt="Photo 7"></div>
    <div id="img8" class="lightbox"><a href="#" class="lightbox-close">&times;</a><img src="sample8.jpg" alt="Photo 8"></div>
    <div id="img9" class="lightbox"><a href="#" class="lightbox-close">&times;</a><img src="sample9.jpg" alt="Photo 9"></div>
</body>
</html>
